<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>现场调研阶段交付流程</title>
<desc>从六角色访谈到需求定义交接的五个步骤</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="60" y="40" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="60" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">① 六角色 × 六维度 = 36 问访谈</text>
<text x="80" y="79" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">采集事实 36/36，证据缺口 0</text>
<text x="440" y="60" font-size="12" fill="#5F5E5A" dominant-baseline="central">事实 f00–f55</text>
<text x="440" y="79" font-size="12" fill="#5F5E5A" dominant-baseline="central">材料 物流-001~036</text>
<line x1="240" y1="96" x2="240" y2="114" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="116" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="136" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">② 三项任务产出</text>
<text x="80" y="155" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">角色地图 / 流程异常 / 四来源收敛</text>
<text x="440" y="136" font-size="12" fill="#5F5E5A" dominant-baseline="central">访谈记录与角色地图</text>
<text x="440" y="155" font-size="12" fill="#5F5E5A" dominant-baseline="central">现状流程 · 收敛表</text>
<line x1="240" y1="172" x2="240" y2="190" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="192" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="80" y="212" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">③ 证据台账与分歧</text>
<text x="80" y="231" font-size="12" font-weight="400" fill="#0F6E56" dominant-baseline="central">5 个矛盾点、6 项待办问题</text>
<text x="440" y="212" font-size="12" fill="#5F5E5A" dominant-baseline="central">定价时点 / 完成口径</text>
<text x="440" y="231" font-size="12" fill="#5F5E5A" dominant-baseline="central">节点耗时，保留不合并</text>
<line x1="240" y1="248" x2="240" y2="266" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="268" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="288" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">④ 阶段关卡</text>
<text x="80" y="307" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">问题、指标口径、调查范围确认</text>
<text x="440" y="288" font-size="12" fill="#5F5E5A" dominant-baseline="central">边界：只读核对</text>
<text x="440" y="307" font-size="12" fill="#5F5E5A" dominant-baseline="central">+ 人工交接</text>
<line x1="240" y1="324" x2="240" y2="342" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="344" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="364" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">⑤ 导出报告 → 需求定义</text>
<text x="80" y="383" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">DR-01~DR-06，需求仍待试点验证</text>
<text x="440" y="364" font-size="12" fill="#5F5E5A" dominant-baseline="central">停止条件写入</text>
<text x="440" y="383" font-size="12" fill="#5F5E5A" dominant-baseline="central">验收标准</text>
</svg>
